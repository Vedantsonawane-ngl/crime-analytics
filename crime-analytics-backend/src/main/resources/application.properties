# Database Connection (H2 default for cloud deployment, PostgreSQL when DB_URL provided)
spring.datasource.url=${DB_URL:jdbc:h2:mem:crime_ai;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration (Catalyst AppSail compatibility)
server.port=${X_ZOHO_CATALYST_LISTEN_PORT:${PORT:9090}}

# OpenAI API Key fallback
openai.api.key=${OPENAI_API_KEY:demo_openai_key}
openai.api.url=https://api.openai.com/v1/chat/completions

