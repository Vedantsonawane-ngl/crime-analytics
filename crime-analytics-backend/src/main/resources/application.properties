# Database Connection (H2 in-memory for cloud deployment)
spring.datasource.url=jdbc:h2:mem:crime_ai;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Server Configuration (Catalyst AppSail compatibility)
server.port=${X_ZOHO_CATALYST_LISTEN_PORT:9090}

# OpenAI API Key fallback
openai.api.key=${OPENAI_API_KEY:demo_openai_key}
openai.api.url=https://api.openai.com/v1/chat/completions

# Disable unnecessary startup checks
spring.jpa.open-in-view=false
